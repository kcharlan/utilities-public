<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>LLM Usage Counter</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #15231e;
      --muted: #64716b;
      --line: #d8dedb;
      --surface: #f9fbfa;
      --green: #17824f;
      --green-soft: #e5f5ec;
      --red: #bf3b35;
      --red-soft: #fbe9e7;
      --amber: #a46713;
      --amber-soft: #fff2d8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 360px;
      color: var(--ink);
      background:
        linear-gradient(rgba(21, 35, 30, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(21, 35, 30, 0.025) 1px, transparent 1px),
        var(--surface);
      background-size: 18px 18px;
      font: 13px/1.45 "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }
    .shell { padding: 12px; }
    .masthead { margin-bottom: 10px; }
    .masthead h1 {
      margin: 0;
      font-family: "DIN Alternate", "Avenir Next Condensed", sans-serif;
      font-size: 16px;
      letter-spacing: 0.035em;
      text-transform: uppercase;
    }
    .masthead p { margin: 1px 0 0; color: var(--muted); font-size: 11px; }
    #status {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 9px;
      align-items: center;
      min-height: 62px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-left-width: 4px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 6px 18px rgba(21, 35, 30, 0.07);
    }
    #status[data-state="connected"] { border-left-color: var(--green); background: var(--green-soft); }
    #status[data-state="error"] { border-left-color: var(--red); background: var(--red-soft); }
    #status[data-state="checking"] { border-left-color: var(--amber); background: var(--amber-soft); }
    .status-dot {
      width: 13px;
      height: 13px;
      border: 2px solid white;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--amber) 30%, transparent);
    }
    #status[data-state="connected"] .status-dot {
      background: var(--green);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--green) 30%, transparent);
    }
    #status[data-state="error"] .status-dot {
      background: var(--red);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--red) 30%, transparent);
    }
    #status[data-state="checking"] .status-dot { animation: pulse 1.1s ease-in-out infinite; }
    .status-kicker {
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    #statusLabel { font-size: 15px; font-weight: 700; line-height: 1.25; }
    #statusDetail { margin-top: 1px; color: var(--muted); font-size: 11px; }
    .row { display: flex; justify-content: space-between; gap: 8px; }
    .row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 250px; }
    .btns { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
    button {
      padding: 5px 8px;
      border: 1px solid #c7cfcb;
      border-radius: 5px;
      color: var(--ink);
      background: #fff;
      font: 600 11px/1.2 "Avenir Next", Avenir, sans-serif;
      cursor: pointer;
    }
    button:hover { border-color: #8e9b95; background: #f2f5f3; }
    button:focus-visible { outline: 2px solid #276a50; outline-offset: 2px; }
    #notice { min-height: 17px; margin-bottom: 5px; color: var(--muted); font-size: 11px; }
    #notice[data-tone="error"] { color: var(--red); }
    #notice[data-tone="success"] { color: var(--green); }
    #list {
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.8);
    }
    textarea {
      width: 100%;
      height: 145px;
      margin-top: 8px;
      padding: 8px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
    }
    small { color: #666; }
    @keyframes pulse {
      0%, 100% { transform: scale(0.88); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #status[data-state="checking"] .status-dot { animation: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <h1>LLM Usage Counter</h1>
      <p>Local collector diagnostics</p>
    </header>

    <div id="status" data-state="checking" role="status" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <div>
        <div class="status-kicker">Collector link</div>
        <div id="statusLabel">Checking…</div>
        <div id="statusDetail">Contacting the local collector</div>
      </div>
    </div>

    <div class="btns">
      <button id="reload"    type="button">Reload</button>
      <button id="forcePush" type="button">Force Push</button>
      <button id="reset"     type="button">Clear Pending</button>
      <button id="export"    type="button">Export JSON</button>
    </div>
    <div id="notice" role="status" aria-live="polite"></div>

    <div id="list"></div>

    <textarea id="out" aria-label="Exported diagnostics" placeholder="Exported JSON appears here…"></textarea>
  </main>

  <!-- important: defer so DOM is ready before popup.js runs -->
  <script src="popup.js" defer></script>
</body>
</html>
