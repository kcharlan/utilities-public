services:
  n8n:
    image: n8nio/n8n:2.0.2
    ports:
      - "${N8N_BIND_HOST:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    environment:
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}"
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: "${GENERIC_TIMEZONE:-UTC}"
      N8N_LOG_LEVEL: "${N8N_LOG_LEVEL:-info}"
    volumes:
      - "${N8N_DATA_DIR:?Set N8N_DATA_DIR in .env}:/home/node/.n8n"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
