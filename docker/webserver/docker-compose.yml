services:
  web:
    image: nginx:stable-alpine
    depends_on:
      index:
        condition: service_healthy
      app_py:
        condition: service_healthy
      app_node:
        condition: service_healthy
    ports:
      - "127.0.0.1:7711:80"
    volumes:
      - "${WEBROOT_PATH:?Set WEBROOT_PATH in docker/webserver/.env}:/usr/share/nginx/html:ro"
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  index:
    build: ./index
    working_dir: /srv
    command: node server.js
    environment:
      CONFIG_ROOT: /mnt/config
      WEBROOT: /mnt/webroot
    volumes:
      - "${WEBROOT_PATH:?Set WEBROOT_PATH in docker/webserver/.env}:/mnt/webroot:ro"
      - "${WEBROOT_PATH:?Set WEBROOT_PATH in docker/webserver/.env}/.webserver:/mnt/config"
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/configure/api/endpoints').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  app_py:
    build: ./app_py
    # environment:
    #   MODULE_NAME: main
    #   VARIABLE_NAME: app
    volumes:
      - ./app_py:/app:ro
    expose:
      - "80"       # was "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/api/py/hello', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  app_node:
    build:
      context: .
      dockerfile: app_node_Dockerfile
    working_dir: /srv
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/node/hello').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
