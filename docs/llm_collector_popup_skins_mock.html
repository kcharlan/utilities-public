<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popup skins mock</title>
<style>
  /* ---------- Mock page chrome (not part of the popup) ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 24px 48px;
    background: #d9dcdf; color: #22272b;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  body.page-dark { background: #3a3e42; color: #e8eaec; }
  .page-head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; margin-bottom: 8px; }
  .page-head h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .ctl { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; }
  .seg { display: inline-flex; border: 1px solid #b2b8be; border-radius: 7px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: none; padding: 5px 11px; font: inherit; font-size: 12px; cursor: pointer; color: #3a4148; }
  .seg button + button { border-left: 1px solid #d3d7db; }
  .seg button[aria-pressed="true"] { background: #2d343a; color: #fff; }
  .page-note { margin: 0 0 18px; font-size: 12px; opacity: .75; max-width: 760px; }
  .stage { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
  .slot > .cap { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  .slot > .cap span { font-weight: 400; opacity: .7; }
  .frame {
    width: 360px; max-height: 600px; overflow-y: auto; border-radius: 10px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.16), 0 14px 34px rgba(0,0,0,.2);
  }

  /* =================================================================
     Popup: shared structure. Everything visual lives in a skin block.
     ================================================================= */
  .pop { min-height: 100%; }
  .pop h1, .pop h2, .pop p, .pop ul, .pop dl { margin: 0; padding: 0; }
  .pop ul { list-style: none; }
  .pop button { font: inherit; cursor: pointer; }
  .pop button:disabled { cursor: default; }
  .pop summary { list-style: none; cursor: pointer; }
  .pop summary::-webkit-details-marker { display: none; }
  .pop :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .pop .num { font-variant-numeric: tabular-nums; }
  .pop .ft { position: sticky; bottom: 0; z-index: 2; }
  .pop .menu { position: absolute; right: 10px; bottom: calc(100% + 6px); width: 232px; }
  .pop .menu[hidden] { display: none; }
  .pop .switch { appearance: none; margin: 0; flex: none; position: relative; cursor: pointer; background: var(--track); transition: background .15s; }
  .pop .switch::after { content: ""; position: absolute; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
  .pop .switch:checked { background: var(--ok); }
  .pop .chev { flex: none; width: 7px; height: 7px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
  .pop details[open] > summary .chev { transform: rotate(45deg); }
  @media (prefers-reduced-motion: reduce) { .pop * { transition: none !important; animation: none !important; } }

  /* =================================================================
     Skin: Meter. Portable, card-based, tally bars, DIN numerals.
     ================================================================= */
  [data-skin="meter"] {
    --bg: #f5f7f6; --surface: #ffffff; --ink: #17201c; --muted: #66726c; --line: #dde3e0;
    --ok: #23704f; --ok-soft: #e3f0e9; --warn: #9a5a00; --warn-soft: #fbf0dc; --warn-bar: #d39a3d;
    --bad: #b0292b; --bad-soft: #fbe8e7; --bad-ink: #5e1616; --bad-line: #e6c3c2;
    --btn: #ffffff; --btn-line: #c9d1cd; --btn-hover: #f0f3f1;
    --primary: #17201c; --primary-ink: #ffffff; --track: #cfd6d2; --focus: #23704f;
    background: var(--bg); color: var(--ink);
    font: 13px/1.45 "Avenir Next", Avenir, "Segoe UI", sans-serif;
  }
  [data-skin="meter"][data-theme="dark"] {
    --bg: #141a17; --surface: #1c2420; --ink: #e5ebe8; --muted: #93a19a; --line: #2d3732;
    --ok: #52c08b; --ok-soft: rgba(82,192,139,.14); --warn: #e3a646; --warn-soft: rgba(227,166,70,.14); --warn-bar: #b7822f;
    --bad: #f07a73; --bad-soft: rgba(240,122,115,.13); --bad-ink: #f6d2cf; --bad-line: #5a2f2d;
    --btn: #222b27; --btn-line: #38443e; --btn-hover: #2a3530;
    --primary: #e5ebe8; --primary-ink: #141a17; --track: #3a4540; --focus: #52c08b;
  }
  [data-skin="meter"] .num { font-family: "DIN Alternate", Bahnschrift, "Avenir Next", sans-serif; }
  [data-skin="meter"] .row { display: flex; align-items: baseline; gap: 8px; }
  [data-skin="meter"] .k { flex: 1; min-width: 0; }

  [data-skin="meter"] .hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px 12px; }
  [data-skin="meter"] .app { font-size: 15px; font-weight: 600; letter-spacing: -.005em; }
  [data-skin="meter"] .status { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; }
  [data-skin="meter"] .status .mark { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  [data-skin="meter"] .status .mark svg, [data-skin="meter"] .st-detail { display: none; }
  [data-skin="meter"] .status[data-s="ok"] { color: var(--ok); background: var(--ok-soft); }
  [data-skin="meter"] .status[data-s="bad"] { color: var(--bad); background: var(--bad-soft); }
  [data-skin="meter"] .alert { margin: 0 12px 10px; padding: 9px 12px; border-radius: 8px; background: var(--bad-soft); color: var(--bad-ink); font-size: 12px; }

  [data-skin="meter"] .reg { margin: 0 12px; padding: 12px 14px 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  [data-skin="meter"] .sec-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 400; }
  [data-skin="meter"] .sec-h .num { color: var(--ink); font-size: 15px; }
  [data-skin="meter"] .reg .row { flex-wrap: wrap; padding: 7px 0 8px; border-top: 1px solid var(--line); }
  [data-skin="meter"] .reg .row:first-child { border-top: 0; }
  [data-skin="meter"] .reg .k { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  [data-skin="meter"] .reg .q { color: var(--warn); font-size: 11px; font-weight: 600; }
  [data-skin="meter"] .reg .v { font-size: 21px; line-height: 1; min-width: 2.2ch; text-align: right; }
  [data-skin="meter"] .bar { flex-basis: 100%; display: flex; height: 3px; margin-top: 6px; border-radius: 2px; background: var(--line); overflow: hidden; }
  [data-skin="meter"] .bar span { height: 100%; background: var(--ok); }
  [data-skin="meter"] .bar span.bq { background: var(--warn-bar); }
  [data-skin="meter"] .empty { padding: 4px 0 12px; color: var(--muted); font-size: 12px; }

  [data-skin="meter"] .fold { margin: 8px 12px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  [data-skin="meter"] .fold > summary { align-items: center; padding: 9px 12px; font-weight: 500; }
  [data-skin="meter"] .fold > summary .chev { margin-right: 4px; }
  [data-skin="meter"] .state { color: var(--muted); font-weight: 400; font-size: 12px; }
  [data-skin="meter"] .state.warn { color: var(--warn); font-weight: 500; }
  [data-skin="meter"] .state.bad { color: var(--bad); font-weight: 500; }
  [data-skin="meter"] .fold-body { padding: 2px 12px 12px 30px; font-size: 12px; }
  [data-skin="meter"] .kv { margin-bottom: 10px; }
  [data-skin="meter"] .kv .row { padding: 1px 0; }
  [data-skin="meter"] .kv .k { flex: 0 0 104px; color: var(--muted); }
  [data-skin="meter"] .kv .v { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  [data-skin="meter"] .kv .v.bad { color: var(--bad); }
  [data-skin="meter"] .kv .v.warn { color: var(--warn); }
  [data-skin="meter"] code { font: 11px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  [data-skin="meter"] .sw-row { align-items: center; margin-bottom: 8px; cursor: pointer; }
  [data-skin="meter"] .switch { width: 30px; height: 18px; border-radius: 9px; }
  [data-skin="meter"] .switch::after { top: 2px; left: 2px; width: 14px; height: 14px; }
  [data-skin="meter"] .switch:checked::after { transform: translateX(12px); }
  [data-skin="meter"] .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  [data-skin="meter"] .act { font: 500 12px/1 "Avenir Next", Avenir, "Segoe UI", sans-serif; padding: 7px 11px; border-radius: 6px; border: 1px solid var(--btn-line); background: var(--btn); color: var(--ink); }
  [data-skin="meter"] .act:hover:not(:disabled) { background: var(--btn-hover); }
  [data-skin="meter"] .act.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  [data-skin="meter"] .act.danger { color: var(--bad); border-color: var(--bad-line); }
  [data-skin="meter"] .act.danger:hover:not(:disabled) { background: var(--bad-soft); }
  [data-skin="meter"] .act:disabled { opacity: .45; }
  [data-skin="meter"] .log li { display: grid; grid-template-columns: 54px 1fr; gap: 0 8px; padding: 5px 0; border-top: 1px solid var(--line); }
  [data-skin="meter"] .log li:first-child { border-top: 0; }
  [data-skin="meter"] .log time { grid-row: 1; grid-column: 1; color: var(--muted); font-size: 11px; }
  [data-skin="meter"] .log .dec { grid-row: 1; grid-column: 2; font-weight: 600; font-size: 11px; color: var(--muted); }
  [data-skin="meter"] .log code { grid-column: 2; overflow-wrap: anywhere; }
  [data-skin="meter"] .dec.ok { color: var(--ok); }
  [data-skin="meter"] .dec.bad { color: var(--bad); }
  [data-skin="meter"] .none { color: var(--muted); }

  [data-skin="meter"] .ft { display: flex; gap: 8px; align-items: center; padding: 12px; margin-top: 10px; border-top: 1px solid var(--line); background: var(--surface); }
  [data-skin="meter"] .note { flex: 1; font-size: 11px; color: var(--muted); }
  [data-skin="meter"] .note.ok { color: var(--ok); }
  [data-skin="meter"] .gear { width: 30px; height: 28px; display: grid; place-items: center; border-radius: 6px; border: 1px solid transparent; background: none; color: var(--muted); }
  [data-skin="meter"] .gear:hover, [data-skin="meter"] .gear[aria-expanded="true"] { border-color: var(--btn-line); color: var(--ink); }
  [data-skin="meter"] .menu { padding: 6px; border-radius: 8px; background: var(--surface); border: 1px solid var(--btn-line); box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  [data-skin="meter"] .menu-h { padding: 4px 8px 6px; font-size: 12px; font-weight: 600; }
  [data-skin="meter"] .menu [role="menuitemradio"] { display: flex; width: 100%; gap: 8px; align-items: baseline; padding: 6px 8px; border: 0; border-radius: 5px; background: none; color: var(--ink); text-align: left; }
  [data-skin="meter"] .menu [role="menuitemradio"]:hover { background: var(--btn-hover); }
  [data-skin="meter"] .menu [aria-checked="true"] { background: var(--ok-soft); color: var(--ok); font-weight: 500; }
  [data-skin="meter"] .menu .hint { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 400; }
  [data-skin="meter"] .menu-foot { padding: 6px 8px 2px; font-size: 11px; color: var(--muted); }

  /* =================================================================
     Skin: Native. macOS grouped lists, row buttons, system font.
     ================================================================= */
  [data-skin="native"] {
    --bg: #ececee; --group: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --sep: rgba(60,60,67,.16);
    --ok: #248a3d; --warn: #b25000; --bad: #d70015; --tint: #0a66d8; --track: #d6d6db;
    --hover: rgba(0,0,0,.045); --pill: rgba(0,0,0,.08); --focus: #0a66d8;
    background: var(--bg); color: var(--ink);
    font: 13px/1.38 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    padding: 12px 12px 0;
  }
  [data-skin="native"][data-theme="dark"] {
    --bg: #1c1c1e; --group: #2c2c2e; --ink: #f5f5f7; --muted: #98989d; --sep: rgba(235,235,245,.14);
    --ok: #30d158; --warn: #ff9f0a; --bad: #ff453a; --tint: #3d8bff; --track: #48484a;
    --hover: rgba(255,255,255,.06); --pill: rgba(255,255,255,.12); --focus: #3d8bff;
  }
  [data-skin="native"] .row { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 6px 12px; position: relative; }
  [data-skin="native"] .row + .row::before { content: ""; position: absolute; top: 0; left: 12px; right: 0; height: 1px; background: var(--sep); }
  [data-skin="native"] .k { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  [data-skin="native"] .v { color: var(--muted); }

  [data-skin="native"] .hd { padding: 4px 4px 14px; }
  [data-skin="native"] .app { display: none; }
  [data-skin="native"] .status { display: flex; gap: 11px; align-items: center; }
  [data-skin="native"] .mark { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; background: var(--ok); }
  [data-skin="native"] .status[data-s="bad"] .mark { background: var(--bad); }
  [data-skin="native"] .st-title { display: block; font-size: 14px; font-weight: 600; }
  [data-skin="native"] .st-detail { display: block; color: var(--muted); font-size: 12px; }
  [data-skin="native"] .alert { margin: -4px 0 12px; padding: 9px 12px; border-radius: 10px; background: var(--group); color: var(--ink); font-size: 12px; box-shadow: inset 3px 0 0 var(--bad); }

  [data-skin="native"] .sec-h { display: flex; justify-content: space-between; margin: 0 12px 5px; font-size: 12px; font-weight: 400; color: var(--muted); }
  [data-skin="native"] .group, [data-skin="native"] .fold { background: var(--group); border-radius: 10px; overflow: hidden; }
  [data-skin="native"] .reg .v { color: var(--ink); font-weight: 500; }
  [data-skin="native"] .reg .q { color: var(--warn); font-size: 11px; }
  [data-skin="native"] .bar { display: none; }
  [data-skin="native"] .empty { padding: 9px 12px; color: var(--muted); }

  [data-skin="native"] .fold { margin-top: 10px; }
  [data-skin="native"] .fold > summary { font-weight: 500; }
  [data-skin="native"] .fold > summary:hover { background: var(--hover); }
  [data-skin="native"] .fold > summary .chev { order: 3; margin-left: 2px; }
  [data-skin="native"] .state { font-weight: 400; }
  [data-skin="native"] .state.warn, [data-skin="native"] .kv .v.warn { color: var(--warn); }
  [data-skin="native"] .state.bad, [data-skin="native"] .kv .v.bad { color: var(--bad); }
  [data-skin="native"] .fold-body { position: relative; }
  [data-skin="native"] .fold-body > * { position: relative; }
  [data-skin="native"] .fold-body > *::before { content: ""; position: absolute; top: 0; left: 12px; right: 0; height: 1px; background: var(--sep); }
  [data-skin="native"] .kv .v { max-width: 62%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
  [data-skin="native"] code { font: 11px/1.4 ui-monospace, "SF Mono", Menlo, monospace; }
  [data-skin="native"] .sw-row { cursor: pointer; }
  [data-skin="native"] .switch { width: 36px; height: 21px; border-radius: 11px; }
  [data-skin="native"] .switch::after { top: 2px; left: 2px; width: 17px; height: 17px; }
  [data-skin="native"] .switch:checked::after { transform: translateX(15px); }
  [data-skin="native"] .acts { display: flex; flex-direction: column; }
  [data-skin="native"] .act { position: relative; width: 100%; min-height: 34px; padding: 6px 12px; border: 0; background: none; text-align: left; color: var(--tint); }
  [data-skin="native"] .act + .act::before { content: ""; position: absolute; top: 0; left: 12px; right: 0; height: 1px; background: var(--sep); }
  [data-skin="native"] .act:hover:not(:disabled) { background: var(--hover); }
  [data-skin="native"] .act.danger { color: var(--bad); }
  [data-skin="native"] .act:disabled { color: var(--muted); }
  [data-skin="native"] .log { padding: 0 12px 4px; }
  [data-skin="native"] .log li { display: grid; grid-template-columns: 1fr auto; padding: 6px 0; border-top: 1px solid var(--sep); font-size: 12px; }
  [data-skin="native"] .log li:first-child { border-top: 0; }
  [data-skin="native"] .log .dec { grid-row: 1; grid-column: 1; font-weight: 500; }
  [data-skin="native"] .log time { grid-row: 1; grid-column: 2; color: var(--muted); }
  [data-skin="native"] .log code { grid-column: 1 / -1; color: var(--muted); overflow-wrap: anywhere; }
  [data-skin="native"] .dec.ok { color: var(--ok); }
  [data-skin="native"] .dec.bad { color: var(--bad); }
  [data-skin="native"] .none { padding: 8px 0; color: var(--muted); }

  [data-skin="native"] .ft { display: flex; align-items: center; gap: 6px; margin: 0 -12px; padding: 12px 16px; background: var(--bg); }
  [data-skin="native"] .note { flex: 1; font-size: 11px; color: var(--muted); }
  [data-skin="native"] .note.ok { color: var(--ok); }
  [data-skin="native"] .ft .act { width: auto; min-height: 0; padding: 6px 11px; border-radius: 6px; background: var(--pill); color: var(--ink); font-weight: 500; font-size: 12px; text-align: center; }
  [data-skin="native"] .ft .act.primary { background: var(--tint); color: #fff; }
  [data-skin="native"] .ft .act + .act::before { display: none; }
  [data-skin="native"] .gear { width: 28px; height: 26px; display: grid; place-items: center; border: 0; border-radius: 6px; background: none; color: var(--muted); }
  [data-skin="native"] .gear:hover, [data-skin="native"] .gear[aria-expanded="true"] { background: var(--pill); color: var(--ink); }
  [data-skin="native"] .menu { padding: 5px; border-radius: 10px; background: var(--group); box-shadow: 0 0 0 .5px rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.25); }
  [data-skin="native"] .menu-h { padding: 4px 9px 4px; font-size: 11px; color: var(--muted); }
  [data-skin="native"] .menu [role="menuitemradio"] { display: flex; width: 100%; gap: 6px; align-items: baseline; padding: 4px 9px 4px 22px; border: 0; border-radius: 5px; background: none; color: var(--ink); text-align: left; position: relative; }
  [data-skin="native"] .menu [role="menuitemradio"]:hover { background: var(--tint); color: #fff; }
  [data-skin="native"] .menu [role="menuitemradio"]:hover .hint { color: rgba(255,255,255,.8); }
  [data-skin="native"] .menu [aria-checked="true"]::before { content: "✓"; position: absolute; left: 7px; font-size: 11px; }
  [data-skin="native"] .menu .hint { margin-left: auto; font-size: 11px; color: var(--muted); }
  [data-skin="native"] .menu-foot { margin-top: 4px; padding: 6px 9px 3px; border-top: 1px solid var(--sep); font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
  <div class="page-head">
    <h1>One popup, two skins</h1>
    <span class="ctl">Scenario
      <span class="seg" role="group" aria-label="Scenario">
        <button type="button" data-scn="healthy" aria-pressed="true">Healthy</button>

    <span class="ctl">System appearance
      <span class="seg" role="group" aria-label="System appearance">
        <button type="button" data-th="light" aria-pressed="true">Light</button>
        <button type="button" data-th="dark" aria-pressed="false">Dark</button>
      </span></span>
  </div>
  <p class="page-note">Both popups use identical markup and the same data. Only the skin differs. The gear in each footer opens the Appearance setting; change it and that popup reskins in place. Frames are capped at 600 px tall, the browser's limit for extension popups.</p>

let scn = "healthy", theme = "light";
const frames = [
  { pref: "meter", open: {}, menu: false, note: "" },
  { pref: "native", open: {}, menu: false, note: "" },
];
const skinOf = f => f.pref === "auto" ? (IS_MAC ? "native" : "meter") : f.pref;

const sum = o => Object.values(o || {}).reduce((a, b) => a + b, 0);
const decClass = d => d === "counted" ? "ok" : (d === "recording-failed" || d === "channel-invalid" ? "bad" : "");
function hosts(s) {
  const all = new Set([...Object.keys(s.totals || {}), ...Object.keys(s.pending)]);
  return [...all].map(h => ({ h, total: s.totals ? (s.totals[h] || 0) : null, q: s.pending[h] || 0 }))
    .sort((a, b) => ((b.total ?? 0) + b.q) - ((a.total ?? 0) + a.q));
}
function deliveryState(s) {
  const q = sum(s.pending);
  if (s.deliveryError) return { text: `${q} waiting, retry in ${s.retry}`, cls: "warn" };
  if (q) return { text: `${q} queued`, cls: "warn" };
  return { text: "Up to date", cls: "" };
}
const kv = (k, v, cls = "", title = "") => `<div class="row"><span class="k">${k}</span><span class="v ${cls}"${title ? ` title="${title}"` : ""}>${v}</span></div>`;
const icoOk = `<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="2.2" aria-hidden="true"><path d="M5 10.5l3.2 3.2L15 7"/></svg>`;
const icoBad = `<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="2.2" aria-hidden="true"><path d="M10 5.5v6"/><circle cx="10" cy="14.6" r=".6" fill="#fff"/></svg>`;
const icoGear = `<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14"/><circle cx="7" cy="5.5" r="1.7" fill="var(--bg)"/><circle cx="13" cy="10" r="1.7" fill="var(--bg)"/><circle cx="8.5" cy="14.5" r="1.7" fill="var(--bg)"/></svg>`;

/* One template for both skins. */
function popup(s, f) {
  const rows = hosts(s);
  const max = Math.max(1, ...rows.map(r => (r.total ?? 0) + r.q));
  const q = sum(s.pending);
  const dl = deliveryState(s);
  const isOpen = k => f.open[k] ?? (k === "delivery" && !!s.deliveryError);
  const ok = s.conn === "ok";
  return `
  <header class="hd">
    <h1 class="app">LLM usage</h1>
    <div class="status" data-s="${s.conn}" role="status">
      <span class="mark">${ok ? icoOk : icoBad}</span>
      <div><b class="st-title">${ok ? "Collector connected" : "Collector unreachable"}</b>
        <span class="st-detail">${ok ? `Responded in ${s.latency} ms at ${s.checked}` : `Last checked ${s.checked}`}</span></div>
    </div>
  </header>
  ${ok ? "" : `<p class="alert">${s.detail}</p>`}

  <section class="reg" aria-label="Requests by site">
    <h2 class="sec-h"><span>${s.totals ? "Requests since last reset" : "Waiting to send"}</span><span class="num">${s.totals ? sum(s.totals) : q}</span></h2>
    <div class="group">
      ${rows.length === 0 ? `<p class="empty">No requests yet. Send a prompt on a supported site and it shows up here.</p>` :
        rows.map(r => `<div class="row">
          <span class="k" title="${r.h}">${r.h}</span>
          ${r.q && r.total !== null ? `<span class="q">+${r.q} queued</span>` : ""}
          <span class="v num">${r.total ?? r.q}</span>
          <span class="bar" aria-hidden="true"><span style="width:${(r.total ?? 0) / max * 100}%"></span><span class="bq" style="width:${r.q / max * 100}%"></span></span>
        </div>`).join("")}
    </div>
  </section>

  <details class="fold" data-k="delivery" ${isOpen("delivery") ? "open" : ""}>
    <summary class="row"><span class="chev"></span><span class="k">Delivery</span><span class="state ${dl.cls}">${dl.text}</span></summary>
    <div class="fold-body">
      <div class="kv">
        ${kv("Queued", q - s.inFlight)}
        ${kv("Sent, unconfirmed", s.inFlight ? `${s.inFlight} in batch ${s.seq}` : "0")}
        ${s.deliveryError ? kv("Last error", s.deliveryError, "bad") : ""}
        ${kv("Sequence", s.seq)}
        ${kv("Client", `<code>${CLIENT}</code>`, "", CLIENT)}
      </div>
      <div class="acts">
        <button type="button" class="act" data-a="push" ${q ? "" : "disabled"}>Send now</button>
        <button type="button" class="act danger" data-a="discard" ${q - s.inFlight ? "" : "disabled"}>Discard queued</button>
      </div>
    </div>
  </details>

  <details class="fold" data-k="capture" ${isOpen("capture") ? "open" : ""}>
    <summary class="row"><span class="chev"></span><span class="k">Request capture</span><span class="state">${s.capture.on ? `On, ${s.capture.count} held` : "Off"}</span></summary>
    <div class="fold-body">
      <label class="row sw-row"><span class="k">Record full requests from LLM pages</span><input type="checkbox" class="switch" data-a="cap" ${s.capture.on ? "checked" : ""}></label>
      <div class="kv">
        ${kv("Held", `${s.capture.count} requests`)}
        ${kv("Kept until", "Browser quits")}
        ${kv("Storage", "Working")}
      </div>
      <div class="acts"><button type="button" class="act danger" data-a="discardcap" ${s.capture.count ? "" : "disabled"}>Discard capture</button></div>
    </div>
  </details>

  <details class="fold" data-k="log" ${isOpen("log") ? "open" : ""}>
    <summary class="row"><span class="chev"></span><span class="k">Recent decisions</span><span class="state">${s.logCount ? `${s.logCount} logged` : "None"}</span></summary>
    <div class="fold-body">
      ${s.log.length ? `<ul class="log">${s.log.map(e => `<li><time class="num">${e.t}</time><span class="dec ${decClass(e.d)}">${e.d}</span><code>${e.host}${e.path}</code></li>`).join("")}</ul>`
        : `<p class="none">Nothing observed since the browser started.</p>`}
    </div>
  </details>

  <footer class="ft">
    <span class="note ${f.note ? "ok" : ""}" role="status">${f.note || "Version 0.5.1"}</span>
    <button type="button" class="gear" data-a="menu" aria-label="Appearance" aria-haspopup="menu" aria-expanded="${f.menu}">${icoGear}</button>
    <button type="button" class="act" data-a="check">Check again</button>
    <button type="button" class="act primary" data-a="export">Export</button>
    <div class="menu" role="menu" aria-label="Appearance" ${f.menu ? "" : "hidden"}>
      <div class="menu-h">Appearance</div>
      ${[["auto", "Automatic", IS_MAC ? "Native on this Mac" : "Meter here"], ["meter", "Meter", ""], ["native", "Native", "macOS style"]]
        .map(([v, l, h]) => `<button type="button" role="menuitemradio" data-skin-pick="${v}" aria-checked="${f.pref === v}">${l}<span class="hint">${h}</span></button>`).join("")}
      <div class="menu-foot">Light and dark follow your system setting.</div>
    </div>
  </footer>`;
}

function render() {
  const s = SCN[scn];
  frames.forEach((f, i) => {
    const el = document.getElementById("f" + i);
    const scroll = el.scrollTop;
    el.innerHTML = `<div class="pop" data-skin="${skinOf(f)}" data-theme="${theme}">${popup(s, f)}</div>`;
    el.scrollTop = scroll;
    const label = { auto: "Automatic", meter: "Meter", native: "Native" }[f.pref];
    document.getElementById("cap" + i).innerHTML = `${skinOf(f) === "meter" ? "Meter" : "Native"} <span>Appearance setting: ${label}</span>`;
  });
  document.body.classList.toggle("page-dark", theme === "dark");
}
function flash(f, msg) {
  f.note = msg; render();
  clearTimeout(f.timer); f.timer = setTimeout(() => { f.note = ""; render(); }, 2600);
}
const MSG = { push: "Send requested", discard: "Queued requests discarded", discardcap: "Capture discarded",
  export: "Exported and copied to clipboard", check: "Checked just now" };

frames.forEach((f, i) => {
  const el = document.getElementById("f" + i);
  el.addEventListener("click", e => {
    const pick = e.target.closest("[data-skin-pick]");
    if (pick) { f.pref = pick.dataset.skinPick; f.menu = false; render(); return; }
    const t = e.target.closest("[data-a]");
    if (!t || t.matches('input')) return;
    if (t.dataset.a === "menu") { f.menu = !f.menu; render(); return; }
    if (MSG[t.dataset.a]) flash(f, MSG[t.dataset.a]);
  });
  el.addEventListener("change", e => {
    if (e.target.dataset.a !== "cap") return;
    SCN[scn].capture.on = e.target.checked;
    frames.forEach(x => x.note = "");
    flash(f, `Capture turned ${e.target.checked ? "on" : "off"}`);
  });
  el.addEventListener("toggle", e => { if (e.target.dataset?.k) f.open[e.target.dataset.k] = e.target.open; }, true);
  el.addEventListener("keydown", e => { if (e.key === "Escape" && f.menu) { f.menu = false; render(); } });
});
document.addEventListener("click", e => {
  if (e.target.closest(".ft")) return;
  if (frames.some(f => f.menu)) { frames.forEach(f => f.menu = false); render(); }
});
document.querySelectorAll("[data-scn]").forEach(b => b.addEventListener("click", () => {
  scn = b.dataset.scn;
  frames.forEach(f => f.open = {});
  document.querySelectorAll("[data-scn]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
}));
document.querySelectorAll("[data-th]").forEach(b => b.addEventListener("click", () => {
  theme = b.dataset.th;
  document.querySelectorAll("[data-th]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
}));
if (matchMedia("(prefers-color-scheme: dark)").matches) document.querySelector('[data-th="dark"]').click();
render();
</script>
</body>
</html>
