test_requirements = "data_format_converter/requirements-dev.txt"
test_commands = [["pytest"]]
smoke_args = ["--help"]

[projects.to_gemini_cli]
project = "Claude_plugin_converter/to_gemini_cli"
launcher = "Claude_plugin_converter/to_gemini_cli/migrate_skills.py"
test_commands = [["unittest", "discover", "-s", "tests", "-v"]]
smoke_skip_reason = "The converter treats its argument as a category path and has no help option."

